name: Release

# A tag releases: the same gate as CI runs on the tagged tree, the wheel is
# built from it, and the GitHub release carries the wheel with notes taken from
# the commits. Creating the tag is the only manual step (see AGENTS.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0 # the ancestry check below needs the history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # A tag on an unmerged branch would release code main never gated.
      - name: Tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "${GITHUB_REF_NAME} is not on main" >&2
            exit 1
          fi

      # A tag that disagrees with pyproject would publish a release under a
      # version the wheel and the installed package do not carry.
      - name: Tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi

      - run: uv build --wheel

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The last step, so an existing release means this tag is done: a rerun must not fail on 422.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" dist/*.whl --verify-tag \
            --title "${GITHUB_REPOSITORY#*/} ${TAG#v}" --generate-notes
